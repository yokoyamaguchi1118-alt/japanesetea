<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="300" fill="#eeead9"/>
  <g>
    <rect x="30" y="30" width="220" height="240" rx="8" fill="#dfe3d2"/>
    <path d="M140 90 C170 90 190 115 190 150 C160 150 140 130 140 90 Z" fill="#5c7a34"/>
    <path d="M140 90 C110 90 90 115 90 150 C120 150 140 130 140 90 Z" fill="#8fae52"/>
    <line x1="140" y1="90" x2="140" y2="150" stroke="#3d5c2e" stroke-width="2"/>
    <text x="140" y="200" text-anchor="middle" font-family="'Shippori Mincho B1', serif" font-size="26" font-weight="800" fill="#23201a">2g</text>
    <text x="140" y="230" text-anchor="middle" font-family="monospace" font-size="14" fill="#23201a">per 150ml water</text>
  </g>
  <path d="M270 150 L310 150" stroke="#a8501e" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a8501e"/>
    </marker>
  </defs>
  <g>
    <rect x="330" y="30" width="220" height="240" rx="8" fill="#dfe3d2"/>
    <rect x="425" y="70" width="16" height="90" rx="8" fill="#a8501e"/>
    <circle cx="433" cy="170" r="16" fill="#a8501e"/>
    <text x="433" y="205" text-anchor="middle" font-family="'Shippori Mincho B1', serif" font-size="24" font-weight="800" fill="#23201a">70–80°C</text>
    <text x="433" y="230" text-anchor="middle" font-family="monospace" font-size="14" fill="#23201a">not boiling</text>
  </g>
  <path d="M570 150 L610 150" stroke="#a8501e" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="540" y="30" width="220" height="240" rx="8" fill="#dfe3d2"/>
    <circle cx="650" cy="140" r="45" fill="none" stroke="#23201a" stroke-width="3"/>
    <line x1="650" y1="140" x2="650" y2="108" stroke="#23201a" stroke-width="3" stroke-linecap="round"/>
    <line x1="650" y1="140" x2="672" y2="150" stroke="#23201a" stroke-width="3" stroke-linecap="round"/>
    <text x="650" y="205" text-anchor="middle" font-family="'Shippori Mincho B1', serif" font-size="24" font-weight="800" fill="#23201a">60–90s</text>
    <text x="650" y="230" text-anchor="middle" font-family="monospace" font-size="14" fill="#23201a">steep time</text>
  </g>
</svg>
